[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-to-app"
version = "1.0.0"
description = "🎙️ Stream-of-consciousness voice-to-app generator."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Varun Ruhella" }]
keywords = ["ai", "voice", "app", "generator", "whisper", "llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0.0",
    "litellm",
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
voice2app = "voice2app.cli:main"

[project.urls]
Homepage = "https://github.com/varungor365/voice-to-app"
Repository = "https://github.com/varungor365/voice-to-app"
